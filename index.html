<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工作站 · 3D 办公室</title>
<style>
  :root {
    --paper: #f4efe4;
    --paper-2: #ece4d2;
    --card: #fbf8f1;
    --ink: #2b2620;
    --ink-2: #6b6257;
    --line: #ddd2bd;
    --copper: #b0703c;
    --copper-soft: #e8d9c4;
    --green: #3f7d4e;
    --amber: #b98a1d;
    --gray: #8a8378;
    --shadow: 0 8px 28px rgba(43, 38, 32, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  #app { position: fixed; inset: 0; }
  #scene-container { position: absolute; inset: 0; }
  #scene-container canvas { display: block; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(rgba(244, 239, 228, 0.96), rgba(244, 239, 228, 0.82));
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  #topbar h1 { font-size: 17px; margin: 0; letter-spacing: 1px; }
  #topbar .sub { font-size: 12px; color: var(--ink-2); }
  #snapshot-badge {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: var(--copper-soft); color: var(--ink); border: 1px solid var(--line);
    white-space: nowrap;
  }
  #views { margin-left: auto; display: flex; gap: 8px; }
  .view-btn {
    font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  .view-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  #drawer {
    position: absolute; top: 64px; left: 16px; width: 288px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); z-index: 10; overflow: hidden;
  }
  #drawer-tabs { display: flex; border-bottom: 1px solid var(--line); }
  #drawer-tabs button {
    flex: 1; padding: 10px 0; font-size: 13px; background: none;
    border: none; border-bottom: 2px solid transparent; cursor: pointer; color: var(--ink-2);
  }
  #drawer-tabs button.active { color: var(--ink); border-bottom-color: var(--copper); font-weight: 600; }
  .drawer-panel { padding: 12px; max-height: 52vh; overflow-y: auto; font-size: 13px; }
  .drawer-panel[hidden] { display: none; }
  .agent-row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px; margin-bottom: 4px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 13px; text-align: left;
  }
  .agent-row:hover { border-color: var(--copper); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .model-chip {
    display: inline-block; padding: 4px 8px; margin: 0 4px 4px 0;
    border: 1px solid var(--line); border-radius: 999px; background: #fff;
    font-size: 12px; cursor: pointer;
  }
  .model-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .model-chip.pending { border-style: dashed; color: var(--ink-2); }
  .check-row { padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: #fff; }
  .check-row .warn { color: #a33d1f; font-weight: 600; }
  .check-row .ok { color: var(--green); font-weight: 600; }

  #inspector {
    position: absolute; top: 64px; right: 16px; width: 392px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); z-index: 10; font-size: 13px;
  }
  #inspector[hidden] { display: none; }
  #inspector header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  #inspector header h2 { font-size: 15px; margin: 0; }
  #inspector header button { background: none; border: none; font-size: 16px; cursor: pointer; }
  #inspector-body { padding: 14px; }
  #inspector-body section { margin-bottom: 12px; }
  #inspector-body h3 { font-size: 12px; color: var(--ink-2); margin: 0 0 6px; letter-spacing: 1px; }
  .inspector-actions { display: flex; gap: 8px; }
  .inspector-actions button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor: pointer; font-size: 13px;
  }
  .inspector-actions button.secondary { background: #fff; color: var(--ink); }

  #dialogue {
    position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%);
    width: min(560px, calc(100vw - 32px));
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); z-index: 10; font-size: 13px;
  }
  #dialogue[hidden] { display: none; }
  #dialogue header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  #dialogue header h2 { font-size: 14px; margin: 0; }
  #dialogue header button { background: none; border: none; font-size: 16px; cursor: pointer; }
  #dialogue-log { padding: 12px 14px; max-height: 220px; overflow-y: auto; }
  #dialogue-log .msg { margin-bottom: 8px; line-height: 1.5; }
  #dialogue-log .msg.user { text-align: right; color: var(--ink-2); }
  #dialogue-log .msg .sim { font-size: 11px; color: var(--ink-2); }
  #dialogue-input-row { display: flex; gap: 8px; padding: 0 14px 14px; }
  #dialogue-input {
    flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; font-family: inherit;
  }
  #dialogue-send {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor: pointer; font-size: 13px;
  }

  #dock {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; z-index: 10;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 12px; box-shadow: var(--shadow); font-size: 12px;
    max-width: calc(100vw - 32px); overflow-x: auto;
  }
  #dock .kbd {
    font-weight: 700; border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 6px; background: var(--paper-2); white-space: nowrap;
  }
  #dock .chip {
    padding: 4px 10px; border-radius: 999px; background: var(--paper-2);
    border: 1px solid var(--line); white-space: nowrap;
  }
  #dock .chip b { font-weight: 600; }

  .head-label {
    font-size: 12px; line-height: 1.35; text-align: center;
    background: rgba(251, 248, 241, 0.94);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 8px; white-space: nowrap; color: var(--ink);
    box-shadow: 0 2px 8px rgba(43, 38, 32, 0.14);
    pointer-events: none;
  }
  .head-label .name { font-weight: 700; }
  .head-label .model { color: var(--ink-2); }

  #config-note {
    position: absolute; bottom: 16px; left: 16px; z-index: 10;
    font-size: 11px; color: var(--ink-2); background: rgba(251, 248, 241, 0.85);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
  }
  #config-note[hidden] { display: none; }
  @media (max-width: 720px) {
    #drawer { width: 232px; top: 108px; }
    #inspector { width: calc(100vw - 32px); right: 16px; }
    #topbar { flex-wrap: wrap; }
    #views { margin-left: 0; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="scene-container"></div>

  <header id="topbar">
    <div>
      <h1>AI 工作站</h1>
      <div class="sub">3D 办公室 · Atelier Braun 精密制图室</div>
    </div>
    <span id="snapshot-badge">状态快照（非持续同步）</span>
    <nav id="views">
      <button class="view-btn active" data-view="panoramic">全景</button>
      <button class="view-btn" data-view="closeup">特写</button>
      <button class="view-btn" data-view="top">俯视</button>
      <button class="view-btn" data-view="auto">自动旋转</button>
    </nav>
  </header>

  <aside id="drawer">
    <div id="drawer-tabs">
      <button class="active" data-tab="agents">工位</button>
      <button data-tab="models">模型</button>
      <button data-tab="check">检查</button>
    </div>
    <div class="drawer-panel" id="panel-agents"></div>
    <div class="drawer-panel" id="panel-models" hidden></div>
    <div class="drawer-panel" id="panel-check" hidden></div>
  </aside>

  <section id="inspector" hidden>
    <header>
      <h2 id="inspector-title">工位</h2>
      <button id="inspector-close" aria-label="关闭">✕</button>
    </header>
    <div id="inspector-body"></div>
  </section>

  <section id="dialogue" hidden>
    <header>
      <h2 id="dialogue-title">新对话</h2>
      <button id="dialogue-close" aria-label="关闭">✕</button>
    </header>
    <div id="dialogue-log"></div>
    <div id="dialogue-input-row">
      <input id="dialogue-input" placeholder="输入一句话，比如：让 Gemini 用 4 Neon 写个总结">
      <button id="dialogue-send">发送</button>
    </div>
  </section>

  <footer id="dock">
    <span class="kbd">⌘K</span>
    <span class="chip">工位 <b id="chip-agent">—</b></span>
    <span class="chip">模型 <b id="chip-model">—</b></span>
    <span class="chip">思考 <b id="chip-thinking">—</b></span>
    <span class="chip">主题 <b id="chip-topic">—</b></span>
  </footer>

  <div id="config-note" hidden>配置为离线快照（config/models.json 未能加载）</div>
</div>
<noscript>需要启用 JavaScript 才能打开 3D 办公室。</noscript>
<script type="module" src="./src/app.js"></script>
</body>
</html>
