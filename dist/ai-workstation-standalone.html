<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工作站 · Atelier Braun 精密制图室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e5f0fb;
    --surface: rgba(255, 252, 247, 0.92);
    --surface-solid: #fffcf7;
    --well: #eef3f8;
    --ink: #232130;
    --ink-2: #5b586d;
    --ink-3: #8a869c;
    --hairline: rgba(35, 33, 48, 0.11);
    --hairline-strong: rgba(35, 33, 48, 0.2);
    --accent: #e85d38;
    --accent-soft: rgba(232, 93, 56, 0.12);
    --green: #1f9d63;
    --amber: #d98218;
    --teal: #0f8f96;
    --sky: #3178e8;
    --gray: #8a869c;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow-elev: 0 2px 4px rgba(35, 33, 48, 0.06), 0 14px 34px rgba(42, 60, 92, 0.14);
    --shadow-sm: 0 1px 2px rgba(35, 33, 48, 0.06), 0 4px 12px rgba(42, 60, 92, 0.09);
    --hud-top: 72px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent-soft); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 999px; }

  button {
    font-family: inherit;
    color: inherit;
    transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out), transform 110ms var(--ease-out);
  }
  button:active { transform: scale(0.97); }

  #app { position: fixed; inset: 0; }
  #scene-container { position: absolute; inset: 0; }
  #scene-container canvas { display: block; }

  /* 顶部建筑仪表条 */
  #topbar {
    position: absolute;
    top: 12px;
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand-mark {
    width: 24px;
    height: 24px;
    flex: none;
    color: var(--accent);
  }
  #topbar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; line-height: 1.2; }
  #topbar .sub { font-size: 11px; color: var(--ink-2); line-height: 1.2; }
  .topbar-sep { width: 1px; height: 20px; background: var(--hairline); flex: none; }

  #drawer-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--surface-solid);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  #drawer-toggle:hover { border-color: var(--hairline-strong); }
  #drawer-toggle.active { background: var(--ink); color: var(--surface-solid); border-color: var(--ink); }

  #snapshot-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--well);
    color: var(--ink-2);
    border: 1px solid var(--hairline);
    white-space: nowrap;
  }
  #snapshot-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .view-controls { display: flex; align-items: center; gap: 8px; flex: none; }
  #views {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    background: var(--well);
    border: 1px solid var(--hairline);
    border-radius: 8px;
  }
  .view-btn {
    height: 28px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
  }
  .view-btn:hover { color: var(--ink); }
  .view-btn.active {
    background: var(--surface-solid);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(35, 33, 48, 0.08);
  }
  .auto-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--surface-solid);
    color: var(--ink-2);
  }
  .auto-btn:hover { border-color: var(--hairline-strong); color: var(--ink); }
  .auto-btn.active { background: var(--ink); color: var(--surface-solid); border-color: var(--ink); }

  /* 左侧控制抽屉（无嵌套卡片） */
  #drawer {
    position: absolute;
    top: var(--hud-top);
    left: 16px;
    width: 300px;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    box-shadow: var(--shadow-elev);
    z-index: 10;
    overflow: hidden;
  }
  #drawer[hidden] { display: none; }

  #drawer-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 8px;
    background: var(--well);
    border-bottom: 1px solid var(--hairline);
  }
  #drawer-tabs button[data-tab] {
    height: 28px;
    font-size: 12px;
    font-weight: 500;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: var(--ink-2);
  }
  #drawer-tabs button[data-tab]:hover { color: var(--ink); }
  #drawer-tabs button[data-tab].active {
    background: var(--surface-solid);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(35, 33, 48, 0.08);
  }

  .drawer-panel { max-height: calc(100vh - 192px); overflow-y: auto; font-size: 13px; }
  .drawer-panel[hidden] { display: none; }

  .agent-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    padding: 12px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--hairline);
    text-align: left;
    cursor: pointer;
  }
  .agent-row:last-child { border-bottom: none; }
  .agent-row:hover { background: rgba(49, 120, 232, 0.05); }
  .agent-row.active { background: var(--accent-soft); }
  .agent-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
  .agent-row-id { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .agent-name { font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; }
  .zone-tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 0 4px;
    height: 16px;
    line-height: 16px;
    border-radius: 4px;
    background: var(--well);
    color: var(--ink-2);
    border: 1px solid var(--hairline);
    flex: none;
  }
  .zone-tag.boss-tag {
    background: rgba(217, 130, 24, 0.14);
    color: #9e5d10;
    border-color: rgba(217, 130, 24, 0.35);
  }
  .zone-tag.cli-tag {
    background: rgba(15, 143, 150, 0.12);
    color: #0b6e74;
    border-color: rgba(15, 143, 150, 0.32);
  }
  .zone-tag.agy-tag {
    font-family: inherit;
    background: linear-gradient(135deg, rgba(232, 93, 56, 0.14), rgba(49, 120, 232, 0.14));
    color: #b84222;
    border-color: rgba(232, 93, 56, 0.34);
  }
  .agent-row.boss-row {
    background: rgba(255, 249, 232, 0.72);
  }
  .agent-row.boss-row:hover {
    background: rgba(255, 244, 214, 0.96);
  }
  .agent-model-tag {
    font-size: 11px;
    color: var(--ink-2);
    max-width: 112px;
    flex: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agent-row-task {
    font-size: 12px;
    color: var(--ink-2);
    padding-left: 14px;
    line-height: 1.4;
  }
  .progress-track {
    height: 2px;
    width: 100%;
    margin-top: 4px;
    border-radius: 999px;
    background: var(--well);
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 999px; }

  .model-group { padding: 12px; border-bottom: 1px solid var(--hairline); }
  .model-group:last-child { border-bottom: none; }
  .model-group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .model-group-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .model-group-plan { font-size: 11px; color: var(--ink-2); }
  .model-chip-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .model-empty-note { width: 100%; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .model-chip {
    padding: 4px 8px;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    background: var(--surface-solid);
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .model-chip:hover { border-color: var(--hairline-strong); }
  .model-chip.active { background: var(--ink); color: var(--surface-solid); border-color: var(--ink); }
  .model-chip.pending { border-style: dashed; color: var(--ink-2); background: transparent; }

  .check-row { padding: 12px; border-bottom: 1px solid var(--hairline); }
  .check-row:last-child { border-bottom: none; }
  .check-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .check-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .check-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .check-pill.ok { background: rgba(31, 157, 99, 0.14); color: var(--green); }
  .check-pill.warn { background: var(--accent-soft); color: #b84222; }
  .check-meta { font-size: 12px; color: var(--ink-2); line-height: 1.4; }

  /* 右侧检查员卡片（无标签页，含最近 3 条对话列表） */
  #inspector {
    position: absolute;
    top: var(--hud-top);
    right: 16px;
    width: 336px;
    max-height: calc(100vh - 156px);
    overflow-y: auto;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    box-shadow: var(--shadow-elev);
    z-index: 10;
    font-size: 13px;
  }
  #inspector[hidden] { display: none; }
  #inspector header {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-solid);
    z-index: 1;
  }
  .inspector-head-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #inspector-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #inspector header h2 { font-size: 14px; font-weight: 700; margin: 0; }
  .icon-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .icon-close:hover { background: var(--well); color: var(--ink); }

  #inspector-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .inspector-status-text { font-size: 13px; color: var(--ink); line-height: 1.45; }
  .spec-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--hairline);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    overflow: hidden;
  }
  .spec-cell { background: var(--surface-solid); padding: 8px 12px; }
  .spec-k { font-size: 11px; color: var(--ink-2); margin-bottom: 4px; }
  .spec-v { font-size: 12px; font-weight: 600; color: var(--ink); word-break: break-word; }

  /* 检查员最近 3 条对话选择区 */
  .recent-section { display: flex; flex-direction: column; gap: 6px; }
  .recent-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .recent-list { display: flex; flex-direction: column; gap: 6px; }
  .recent-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--surface-solid);
    text-align: left;
    cursor: pointer;
  }
  .recent-item:hover { border-color: var(--hairline-strong); background: #fff; }
  .recent-item.active {
    border-color: var(--accent);
    background: rgba(232, 93, 56, 0.06);
  }
  .recent-item-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .recent-item-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    color: var(--ink-3);
  }
  .mode-pill {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.4;
    background: var(--well);
    color: var(--ink-2);
    border: 1px solid var(--hairline);
  }
  .mode-pill.local {
    background: rgba(31, 157, 99, 0.12);
    color: #167a4d;
    border-color: rgba(31, 157, 99, 0.28);
  }
  .mode-pill.cloud {
    background: rgba(49, 120, 232, 0.12);
    color: #205cb8;
    border-color: rgba(49, 120, 232, 0.28);
  }
  .mode-pill.record {
    background: rgba(91, 88, 109, 0.09);
    color: var(--ink-2);
    border-color: var(--hairline);
  }

  .inspector-actions { display: flex; gap: 8px; }
  .inspector-actions button {
    flex: 1;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--surface-solid);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .inspector-actions button:hover { background: #36334a; }
  .inspector-actions button.secondary {
    background: var(--surface-solid);
    color: var(--ink);
    border-color: var(--hairline-strong);
  }
  .inspector-actions button.secondary:hover { background: var(--well); }

  /* 独立对话页（⌘K 瞬时打开，含最近 3 条切换条 + +新对话 + 本地/云端切换） */
  #dialogue {
    position: absolute;
    left: 50%;
    bottom: 72px;
    transform: translateX(-50%);
    width: min(548px, calc(100vw - 32px));
    background: var(--surface-solid);
    border: 1px solid var(--hairline-strong);
    border-radius: 12px;
    box-shadow: var(--shadow-elev);
    z-index: 12;
    font-size: 13px;
    overflow: hidden;
  }
  #dialogue[hidden] { display: none; }
  #dialogue header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
  }
  #dialogue header h2 { font-size: 14px; font-weight: 700; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dialogue-head-controls { display: flex; align-items: center; gap: 8px; flex: none; }

  #dialogue-mode-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border-radius: 8px;
    background: var(--well);
    border: 1px solid var(--hairline);
  }
  #dialogue-mode-switch[hidden] { display: none; }
  .mode-switch-btn {
    height: 24px;
    padding: 0 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-switch-btn.active {
    background: var(--surface-solid);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(35, 33, 48, 0.1);
  }

  #dialogue-threads {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--well);
    border-bottom: 1px solid var(--hairline);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #dialogue-threads::-webkit-scrollbar { display: none; }
  .thread-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 26px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: var(--surface-solid);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    max-width: 175px;
    flex: none;
  }
  .thread-pill-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-pill:hover { border-color: var(--hairline-strong); color: var(--ink); }
  .thread-pill.active {
    background: var(--ink);
    color: var(--surface-solid);
    border-color: var(--ink);
    font-weight: 600;
  }
  .thread-pill.new-btn {
    border-style: dashed;
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .thread-pill.new-btn.active {
    border-style: solid;
    background: var(--accent);
    color: #fff;
  }
  .thread-mode-tag {
    font-size: 9px;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 4px;
    background: rgba(49, 120, 232, 0.12);
    color: #205cb8;
    flex: none;
  }
  .thread-pill.active .thread-mode-tag {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
  }

  #dialogue-log { padding: 12px 16px; max-height: 230px; overflow-y: auto; }
  #dialogue-log:empty::before {
    content: "点击上方「+ 新对话」或直接输入一句话即可开始，例如：让 Antigravity 或 Codex 介绍一下自己";
    display: block;
    color: var(--ink-3);
    font-size: 12px;
  }
  #dialogue-log .msg { margin-bottom: 10px; line-height: 1.5; }
  #dialogue-log .msg:last-child { margin-bottom: 0; }
  #dialogue-log .msg.user { text-align: right; color: var(--ink-2); }
  #dialogue-log .msg.loading { color: var(--ink-2); font-style: italic; }
  #dialogue-log .msg-body { white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
  #dialogue-log .msg .sim { font-size: 11px; color: var(--ink-3); }
  #dialogue-input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--hairline);
    background: var(--surface);
  }
  #dialogue-input {
    flex: 1;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
  }
  #dialogue-send {
    height: 36px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--surface-solid);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  #dialogue-send:disabled { opacity: 0.6; cursor: progress; }

  /* 底部指令坞（高密度精密读数条，无滚动条杂讯） */
  #dock {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 6px 16px 6px 8px;
    box-shadow: var(--shadow-elev);
    font-size: 12px;
    max-width: calc(100vw - 32px);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #dock::-webkit-scrollbar { display: none; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// --- inlined from src/labels.js ---

// Zone A 头顶标签错开方案（Antigravity 2026-11-21 给出，修重叠用）：
// Antigravity 挂得更高、往左偏；Gemini 挂得更低、往右偏。
// dy 是头像顶之上的高度（米），dx 是横向偏移（米）。
const ZONE_A_STAGGER = {
  Antigravity: { dy: 0.78, dx: -0.35, zIndex: 12 },
  Gemini: { dy: 0.42, dx: 0.35, zIndex: 11 },
};

// Zone B（OpenAI 双工位：GPT 网页版与 Codex）同样错开，避免旋转视角时头顶标签互盖。
const ZONE_B_STAGGER = {
  'GPT 网页版': { dy: 0.68, dx: -0.15, zIndex: 9 },
  Codex: { dy: 0.42, dx: 0.15, zIndex: 8 },
};

const PLATE_W = 1024;
const PLATE_H = 384;
const FONT_STACK = '"IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif';

function fitFont(ctx, text, maxWidth, startPx, minPx, weight = '') {
  for (let size = startPx; size >= minPx; size -= 4) {
    const font = `${weight ? `${weight} ` : ''}${size}px ${FONT_STACK}`;
    ctx.font = font;
    if (ctx.measureText(text).width <= maxWidth) return font;
  }
  return `${weight ? `${weight} ` : ''}${minPx}px ${FONT_STACK}`;
}

// 单层 1024x384 桌牌：动漫暖白奶油铭牌（第一行名字，第二行默认模型/待核对）。
function makeDeskPlateTexture(agent, defaultModel, accentHex = '#ff6b3d') {
  const canvas = document.createElement('canvas');
  canvas.width = PLATE_W;
  canvas.height = PLATE_H;
  const ctx = canvas.getContext('2d');
  const innerMaxW = PLATE_W - 120;
  const modelText = defaultModel || '待核对';
  const isPending = !defaultModel;

  const bg = ctx.createLinearGradient(0, 0, 0, PLATE_H);
  bg.addColorStop(0, '#FFFDF8');
  bg.addColorStop(1, '#F7F0E4');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, PLATE_W, PLATE_H);

  ctx.strokeStyle = '#D7CDBC';
  ctx.lineWidth = 6;
  ctx.strokeRect(12, 12, PLATE_W - 24, PLATE_H - 24);

  // 顶部亮色品牌识别条（18px）
  ctx.fillStyle = isPending ? '#9E978D' : accentHex;
  ctx.fillRect(15, 15, PLATE_W - 30, 18);

  // 右上角精密状态指示点
  ctx.fillStyle = isPending ? '#9E978D' : accentHex;
  ctx.beginPath();
  ctx.arc(PLATE_W - 56, 72, 11, 0, Math.PI * 2);
  ctx.fill();

  // 第一行：工位名称
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#232130';
  ctx.font = fitFont(ctx, agent.name, innerMaxW, 136, 76, '700');
  ctx.fillText(agent.name, PLATE_W / 2, 150, innerMaxW);

  // 中间分割线
  ctx.fillStyle = 'rgba(35, 33, 48, 0.12)';
  ctx.fillRect(110, 218, PLATE_W - 220, 2);

  // 第二行：默认模型或待核对
  ctx.fillStyle = isPending ? '#8A869C' : '#58546A';
  ctx.font = fitFont(ctx, modelText, innerMaxW, 84, 36, '500');
  ctx.fillText(modelText, PLATE_W / 2, 288, innerMaxW);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 头顶 CSS2D 标签：外层锚点由 CSS2DRenderer 控制定位，内层卡片用于防重叠微调。
function makeHeadLabel(agent, defaultModel, statusColorHex = '#8a869c') {
  const anchor = document.createElement('div');
  anchor.className = 'head-label-anchor';

  const card = document.createElement('div');
  card.className = 'head-label';

  const topRow = document.createElement('div');
  topRow.className = 'head-label-top';

  const dot = document.createElement('span');
  dot.className = 'head-dot';
  dot.style.background = statusColorHex;

  const nameEl = document.createElement('span');
  nameEl.className = 'name';
  nameEl.textContent = agent.name;
  topRow.append(dot, nameEl);

  const modelEl = document.createElement('div');
  modelEl.className = 'model';
  modelEl.textContent = defaultModel || '待核对';

  card.append(topRow, modelEl);
  anchor.appendChild(card);

  const obj = new CSS2DObject(anchor);
  obj.userData.cardEl = card;
  obj.userData.nudgeY = 0;

  // Three.js r160 CSS2DRenderer 每帧会按 renderOrder 覆写 zIndex，因此必须设置 renderOrder。
  const stagger = ZONE_A_STAGGER[agent.name] || ZONE_B_STAGGER[agent.name];
  if (stagger) {
    obj.renderOrder = stagger.zIndex;
    anchor.style.zIndex = String(stagger.zIndex);
    card.dataset.zone = ZONE_A_STAGGER[agent.name] ? 'A' : 'B';
  }
  return obj;
}

// 老板（宇航员奶龙）巡逻头顶标签：renderOrder = 10，始终低于 Zone A（12/11）。
function makeBossLabel(name, statusText) {
  const anchor = document.createElement('div');
  anchor.className = 'head-label-anchor';

  const card = document.createElement('div');
  card.className = 'head-label';
  card.dataset.boss = 'true';

  const topRow = document.createElement('div');
  topRow.className = 'head-label-top';

  const dot = document.createElement('span');
  dot.className = 'head-dot';
  dot.style.background = '#e88422';

  const nameEl = document.createElement('span');
  nameEl.className = 'name';
  nameEl.textContent = name;
  topRow.append(dot, nameEl);

  const modelEl = document.createElement('div');
  modelEl.className = 'model';
  modelEl.textContent = statusText;

  card.append(topRow, modelEl);
  anchor.appendChild(card);

  const obj = new CSS2DObject(anchor);
  obj.renderOrder = 10;
  obj.userData.cardEl = card;
  obj.userData.modelEl = modelEl;
  obj.userData.nudgeY = 0;
  return obj;
}

// 标签到头像之间的短引线。
function makeLeaderLine(from, to) {
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color: 0xd97348, transparent: true, opacity: 0.82 });
  return new THREE.Line(geo, mat);
}

function setCardNudge(labelObj, nudgeY) {
  if (!labelObj?.userData?.cardEl) return;
  if (labelObj.userData.nudgeY === nudgeY) return;
  labelObj.userData.nudgeY = nudgeY;
  labelObj.userData.cardEl.style.transform = nudgeY ? `translateY(${nudgeY}px)` : '';
}

// 渲染后屏幕空间防重叠兜底：默认不干预 3D 错开；仅在侧视/窄屏发生屏幕交叠时纵向拉开。
function resolveZoneAOverlap(antiLabel, geminiLabel, pad = 8) {
  if (!antiLabel || !geminiLabel) return;
  if (antiLabel.element.style.display === 'none' || geminiLabel.element.style.display === 'none') {
    setCardNudge(antiLabel, 0);
    setCardNudge(geminiLabel, 0);
    return;
  }

  const antiCard = antiLabel.userData.cardEl;
  const geminiCard = geminiLabel.userData.cardEl;
  if (!antiCard || !geminiCard) return;

  const ra = antiCard.getBoundingClientRect();
  const rg = geminiCard.getBoundingClientRect();
  if (ra.width === 0 || ra.height === 0 || rg.width === 0 || rg.height === 0) return;

  const prevA = antiLabel.userData.nudgeY || 0;
  const prevG = geminiLabel.userData.nudgeY || 0;
  const baseATop = ra.top - prevA;
  const baseABottom = ra.bottom - prevA;
  const baseGTop = rg.top - prevG;
  const baseGBottom = rg.bottom - prevG;

  const overlapX = Math.min(ra.right, rg.right) - Math.max(ra.left, rg.left) + pad;
  const overlapY = Math.min(baseABottom, baseGBottom) - Math.max(baseATop, baseGTop) + pad;

  let nudgeA = 0;
  let nudgeG = 0;
  if (overlapX > 0 && overlapY > 0) {
    const centerA = (baseATop + baseABottom) / 2;
    const centerG = (baseGTop + baseGBottom) / 2;
    if (centerA <= centerG) {
      const needed = (baseABottom + pad) - baseGTop;
      if (needed > 0) {
        nudgeA = -Math.ceil(needed / 2);
        nudgeG = Math.ceil(needed / 2);
      }
    } else {
      const needed = (baseGBottom + pad) - baseATop;
      if (needed > 0) {
        nudgeG = -Math.ceil(needed / 2);
        nudgeA = Math.ceil(needed / 2);
      }
    }
  }

  setCardNudge(antiLabel, nudgeA);
  setCardNudge(geminiLabel, nudgeG);
}

function makeBellyTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f7b738';
  ctx.fillRect(0, 0, 512, 256);

  // 胸腹正中奶黄色大肚皮（Lathe 旋转 π 后 u=0.5 对齐正面 +Z）
  const grad = ctx.createRadialGradient(256, 138, 24, 256, 138, 128);
  grad.addColorStop(0, '#fff0bc');
  grad.addColorStop(0.76, '#ffd66b');
  grad.addColorStop(0.92, '#f7b738');
  grad.addColorStop(1, 'rgba(247, 183, 56, 0)');

  ctx.save();
  ctx.translate(256, 138);
  ctx.scale(1.06, 0.84);
  ctx.translate(-256, -138);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(256, 138, 128, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

function makeChestBoxTexture() {

  ctx.fillRect(26, 48, 86, 56);
  ctx.fillStyle = '#535861';

  ctx.fillStyle = '#2b2c30';
  ctx.fillRect(26, 114, 42, 22);

  // 右侧亮珊瑚橙宇航徽章 + 小星星
  ctx.fillStyle = '#e86c36';
  ctx.fillRect(132, 26, 98, 66);
  ctx.fillStyle = '#fff0bc';
  ctx.beginPath();
  ctx.arc(158, 59, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(196, 42);
  ctx.lineTo(212, 72);
  ctx.lineTo(180, 72);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#3a3834';
  ctx.fillRect(156, 104, 62, 26);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeHoseTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 32;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#eae7e0';
  ctx.fillRect(0, 0, 256, 32);
  ctx.fillStyle = '#c4beb3';
  for (let x = 0; x < 256; x += 16) {
    ctx.fillRect(x, 0, 6, 32);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(22, 1);
  return tex;
}

function makeHand(oliveMat) {
  const hand = new THREE.Group();
  const palm = new THREE.Mesh(new THREE.SphereGeometry(0.068, 14, 12), oliveMat);
  palm.scale.set(1.0, 0.9, 0.72);
  hand.add(palm);
  for (let i = 0; i < 4; i++) {
    const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.017, 0.042, 4, 8), oliveMat);
    finger.position.set(-0.036 + i * 0.024, -0.066, 0.008);
    finger.rotation.z = (-0.18 + i * 0.12);
    hand.add(finger);
  }
  const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.017, 0.035, 4, 8), oliveMat);
  thumb.position.set(0.056, -0.018, 0.018);
  thumb.rotation.z = -0.65;
  hand.add(thumb);
  return hand;
}

function makeBootFoot(whiteMat, oliveMat, metalMat) {
  const foot = new THREE.Group();
  const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.105, 0.22, 18), stdYellow());
  thigh.position.y = -0.11;
  thigh.castShadow = true;
  foot.add(thigh);

  const bootShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.126, 0.19, 18), whiteMat);

  foot.add(bootShaft);

  const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.116, 0.021, 10, 22), whiteMat);
  cuff.rotation.x = Math.PI / 2;
  cuff.position.y = -0.195;
  foot.add(cuff);

  const sole = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.132, 0.045, 18), oliveMat);
  sole.position.set(0, -0.395, 0.02);

  foot.add(sole);

  const toeCap = new THREE.Mesh(new THREE.SphereGeometry(0.112, 16, 12), whiteMat);

function angleDiff(a, b) {
  const twoPi = Math.PI * 2;
  return ((((b - a + Math.PI) % twoPi) + twoPi) % twoPi) - Math.PI;
}

function lerpAngle(a, b, t) {
  return a + angleDiff(a, b) * t;
}

  // 9. 短腿与白宇航靴
  const leftLeg = makeBootFoot(whiteSuitMat, oliveMat, metalMat);
  leftLeg.position.set(0.175, 0.42, 0.01);

  root.add(rightLeg);

  // 底部接触阴影 + 头顶巡逻状态标签

  shadow.position.set(0, 0.015, 0);
  root.add(shadow);

  const label = makeBossLabel('老板 · 宇航员奶龙', WAYPOINTS[0].text);
  label.position.set(0, 2.04, 0);

  // 拾取标记
  const pickables = [];
  root.traverse((obj) => {

      pickables.push(obj);
    }

  // 巡逻 & 沙发休息状态机（启动时先坐在沙发上小憩一会，再起身轮巡）
  const patrol = {
    idx: 0,
    pauseTimer: 9.0,
    paused: false,
    sitting: true,
    sitBlend: 1.0,
    walkPhase: 0,
    statusText: WAYPOINTS[0].text,
  };

  function setStatusText(text) {
    if (patrol.statusText === text) return;
    patrol.statusText = text;
    if (label.userData.modelEl) label.userData.modelEl.textContent = text;
  }

  function applySitPose(b, elapsedTime = 0) {
    const legSwing = Math.sin(elapsedTime * 2.8) * 0.11 * b;
    bodyGroup.position.y = THREE.MathUtils.lerp(bodyGroup.position.y, 0.13 + Math.sin(elapsedTime * 2.0) * 0.008, b * 0.35 + (b === 1 ? 0.65 : 0));
    leftLeg.position.y = THREE.MathUtils.lerp(0.42, 0.54, b);
    rightLeg.position.y = THREE.MathUtils.lerp(0.42, 0.54, b);
    leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, -1.32 + legSwing, 0.22 + (b === 1 ? 0.78 : 0));
    rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -1.32 - legSwing, 0.22 + (b === 1 ? 0.78 : 0));
    waveArm.rotation.x = THREE.MathUtils.lerp(waveArm.rotation.x, -0.35, 0.16 + (b === 1 ? 0.84 : 0));
    waveArm.rotation.z = THREE.MathUtils.lerp(waveArm.rotation.z, -0.42 + Math.sin(elapsedTime * 1.8) * 0.08, 0.16 + (b === 1 ? 0.84 : 0));
    label.position.y = 2.04 + b * 0.12;
    shadow.material.opacity = THREE.MathUtils.lerp(0.28, 0.08, b);
  }

  // 初始坐在沙发上面朝室内
  if (WAYPOINTS[0].lookAt) {
    const [lx, lz] = WAYPOINTS[0].lookAt;
    root.rotation.y = Math.atan2(lx - root.position.x, lz - root.position.z);
  }
  applySitPose(1.0, 0);

  function update(dt, elapsed) {
    if (reducedMotion) {
      applySitPose(1.0, 0);
      return;
    }

    const wp = WAYPOINTS[patrol.idx];
    const shouldSit = !patrol.paused && Boolean(wp.sit) && patrol.pauseTimer > 0;
    patrol.sitting = shouldSit || patrol.sitBlend > 0.5;

    if (patrol.paused) {
      setStatusText(patrol.sitBlend > 0.5 ? '在沙发歇息中 · 已暂停轮巡' : '巡查已暂停 · 原地待命');
      if (patrol.sitBlend > 0.5) {
        patrol.sitBlend = THREE.MathUtils.lerp(patrol.sitBlend, 1.0, Math.min(1, dt * 4.0));
        bodyGroup.rotation.z *= 0.85;
        applySitPose(patrol.sitBlend, elapsed);
      } else {
        leftLeg.position.y = THREE.MathUtils.lerp(leftLeg.position.y, 0.42, 0.15);
        rightLeg.position.y = THREE.MathUtils.lerp(rightLeg.position.y, 0.42, 0.15);
        leftLeg.rotation.x *= 0.85;
        rightLeg.rotation.x *= 0.85;
        bodyGroup.position.y *= 0.85;
        bodyGroup.rotation.z *= 0.85;
        waveArm.rotation.x = THREE.MathUtils.lerp(waveArm.rotation.x, 0, 0.12);
        waveArm.rotation.z = THREE.MathUtils.lerp(waveArm.rotation.z, -2.25 + Math.sin(elapsed * 4.5) * 0.14, 0.12);
      }
      return;
    }

    if (patrol.pauseTimer > 0) {
      if (wp.sit) {
        const targetYaw = Math.PI;
        root.rotation.y = lerpAngle(root.rotation.y, targetYaw, Math.min(1, dt * 10.0));
        const remainingYaw = Math.abs(angleDiff(root.rotation.y, targetYaw));
        if (remainingYaw < 0.04) root.rotation.y = targetYaw;

        if (remainingYaw < 0.3) {
          patrol.pauseTimer -= dt;
          setStatusText(wp.text || '沙发小憩 · 喝茶看大家');
          patrol.sitBlend = Math.min(1.0, patrol.sitBlend + dt * 2.4);
          bodyGroup.rotation.z = THREE.MathUtils.lerp(bodyGroup.rotation.z, 0, 0.2);
          applySitPose(patrol.sitBlend, elapsed);
        } else {
          // 抵达沙发位先原地转正面向室内，再优雅坐下
          setStatusText('转身准备坐下…');
          leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.25);
          rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.25);
          bodyGroup.rotation.z = THREE.MathUtils.lerp(bodyGroup.rotation.z, 0, 0.25);
          bodyGroup.position.y = THREE.MathUtils.lerp(bodyGroup.position.y, 0, 0.25);
        }
      } else {
        patrol.pauseTimer -= dt;
        setStatusText(wp.text || '停靠休息中');
        if (wp.lookAt) {
          const targetYaw = Math.atan2(wp.lookAt[0] - root.position.x, wp.lookAt[1] - root.position.z);
          root.rotation.y = lerpAngle(root.rotation.y, targetYaw, Math.min(1, dt * 5.0));
        }
        patrol.sitBlend = Math.max(0.0, patrol.sitBlend - dt * 2.4);
        leftLeg.position.y = THREE.MathUtils.lerp(leftLeg.position.y, 0.42, 0.18);
        rightLeg.position.y = THREE.MathUtils.lerp(rightLeg.position.y, 0.42, 0.18);
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.15);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.15);
        bodyGroup.position.y = THREE.MathUtils.lerp(bodyGroup.position.y, Math.sin(elapsed * 2.2) * 0.01, 0.15);
        bodyGroup.rotation.z = THREE.MathUtils.lerp(bodyGroup.rotation.z, 0, 0.15);
        waveArm.rotation.x = THREE.MathUtils.lerp(waveArm.rotation.x, 0, 0.15);
        waveArm.rotation.z = THREE.MathUtils.lerp(
          waveArm.rotation.z,
          -2.25 + Math.sin(elapsed * 7.0) * 0.22,
          0.18,
        );
        label.position.y = 2.04 + patrol.sitBlend * 0.12;
        shadow.material.opacity = THREE.MathUtils.lerp(0.28, 0.08, patrol.sitBlend);
      }

      if (patrol.pauseTimer <= 0) {
        patrol.idx = (patrol.idx + 1) % WAYPOINTS.length;
      }
      return;
    }

    // 先从沙发稳步起身再向前迈步
    if (patrol.sitBlend > 0.08) {
      patrol.sitBlend = Math.max(0.0, patrol.sitBlend - dt * 2.8);
      const b = patrol.sitBlend;
      leftLeg.position.y = THREE.MathUtils.lerp(0.42, 0.54, b);
      rightLeg.position.y = THREE.MathUtils.lerp(0.42, 0.54, b);
      leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, -1.32 * b, 0.25);
      rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -1.32 * b, 0.25);
      bodyGroup.position.y = THREE.MathUtils.lerp(bodyGroup.position.y, 0.13 * b, 0.25);
      waveArm.rotation.x = THREE.MathUtils.lerp(waveArm.rotation.x, 0, 0.2);
      waveArm.rotation.z = THREE.MathUtils.lerp(waveArm.rotation.z, -0.25, 0.2);
      label.position.y = 2.04 + b * 0.12;
      shadow.material.opacity = THREE.MathUtils.lerp(0.28, 0.08, b);
      setStatusText('准备起身去巡查…');
      return;
    }
    patrol.sitBlend = 0;
    leftLeg.position.y = 0.42;
    rightLeg.position.y = 0.42;
    label.position.y = 2.04;
    shadow.material.opacity = 0.28;

    // 慢步巡查前往下一巡逻点
    setStatusText(wp.walkText || '慢步巡查中');
    const dx = wp.x - root.position.x;
    const dz = wp.z - root.position.z;
    const dist = Math.hypot(dx, dz);
    const speed = 1.12;

    if (dist < 0.08) {
      root.position.x = wp.x;
      root.position.z = wp.z;
      if (wp.pause > 0) {
        patrol.pauseTimer = wp.pause;
      } else {
        patrol.idx = (patrol.idx + 1) % WAYPOINTS.length;
      }
      return;
    }

    const stepDist = Math.min(dist, speed * dt);
    root.position.x += (dx / dist) * stepDist;
    root.position.z += (dz / dist) * stepDist;

    const moveYaw = Math.atan2(dx, dz);
    root.rotation.y = lerpAngle(root.rotation.y, moveYaw, Math.min(1, dt * 6.5));

    // 奶龙悠闲摇摆步态
    patrol.walkPhase += dt * 6.4;
    const swing = Math.sin(patrol.walkPhase);
    leftLeg.rotation.x = swing * 0.36;
    rightLeg.rotation.x = -swing * 0.36;
    bodyGroup.position.y = Math.abs(swing) * 0.028;
    bodyGroup.rotation.z = swing * 0.056;
    waveArm.rotation.z = THREE.MathUtils.lerp(waveArm.rotation.z, -0.22, 0.15);
    waveArm.rotation.x = THREE.MathUtils.lerp(waveArm.rotation.x, -swing * 0.3, 0.18);
  }

  return {
    root,
    pickables,
    label,
    getStatus: () => patrol.statusText,
    isPaused: () => patrol.paused,
    isSitting: () => patrol.sitting,
    startPatrol: () => {
      patrol.paused = false;
      patrol.pauseTimer = 0;
      if (patrol.idx === 0 || patrol.idx >= 9) {
        patrol.idx = 1;
      }
      setStatusText('准备起身去巡查…');
    },
    goSit: () => {
      patrol.paused = false;
      patrol.pauseTimer = 0;
      if (patrol.idx === 0) {
        patrol.pauseTimer = WAYPOINTS[0].pause;
      } else if (patrol.idx === 1 || Math.hypot(root.position.x - 5.4, root.position.z - 1.82) < 0.45) {
        patrol.idx = 0;
      } else if (root.position.x > 3.5 && root.position.z > 0.6) {
        patrol.idx = 10;
      } else if (patrol.idx < 9) {
        patrol.idx = 9;
      }
      setStatusText('巡查完毕 · 回沙发歇会');
    },
    togglePause: () => {
      patrol.paused = !patrol.paused;
      return patrol.paused;
    },
    update,
  };
}

function std(color, roughness = 0.85, extra = {}) {
  return new THREE.MeshStandardMaterial({
    color,

    ...extra,
  });
}

function seededRng(seed = 1) {
  let s = (seed >>> 0) || 1;
  return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
}

function makeCanvasTex(w, h, draw, { srgb = true, repeat = null, aniso = 8 } = {}) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) {
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  t.anisotropy = Math.min(aniso, renderer.capabilities.getMaxAnisotropy());
  return t;
}

function makeOakFloorTexture() {
  const rand = seededRng(2026);
  return makeCanvasTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#dfb374';
    ctx.fillRect(0, 0, w, h);
    const rows = 8;
    const plankH = h / rows;
    for (let r = 0; r < rows; r++) {
      const y = r * plankH;
      const offset = (r % 2) * (w * 0.35);
      for (let col = -1; col < 3; col++) {
        const x = col * (w * 0.5) + offset;
        const tone = Math.floor((rand() - 0.5) * 12);
        ctx.fillStyle = `rgb(${225 + tone}, ${178 + tone}, ${116 + Math.round(tone * 0.8)})`;
        ctx.fillRect(x, y, w * 0.5 - 2, plankH - 2);
        ctx.strokeStyle = 'rgba(155, 102, 48, 0.11)';
        ctx.lineWidth = 1.2;
        for (let g = 0; g < 5; g++) {
          const gy = y + 5 + rand() * (plankH - 10);
          ctx.beginPath();
          ctx.moveTo(x + 2, gy);
          ctx.lineTo(x + w * 0.5 - 4, gy + (rand() - 0.5) * 2.5);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(132, 86, 42, 0.18)';
        ctx.fillRect(x + w * 0.5 - 2, y, 2, plankH);
      }
      ctx.fillStyle = 'rgba(132, 86, 42, 0.16)';
      ctx.fillRect(0, y + plankH - 2, w, 2);
    }
  }, { repeat: [5, 4] });
}

function makeAnimeSkyWindowTexture() {
  return makeCanvasTex(1024, 512, (ctx, w, h) => {
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#358ff0');
    sky.addColorStop(0.45, '#78cbff');
    sky.addColorStop(0.8, '#cdeaff');
    sky.addColorStop(1, '#ffe4b8');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // 柔光太阳晕
    const sunGrad = ctx.createRadialGradient(w * 0.78, h * 0.24, 10, w * 0.78, h * 0.24, 190);
    sunGrad.addColorStop(0, 'rgba(255, 252, 232, 0.98)');
    sunGrad.addColorStop(0.35, 'rgba(255, 238, 184, 0.55)');
    sunGrad.addColorStop(1, 'rgba(255, 224, 165, 0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, w, h);

    // 新海诚风赛璐璐立体积雨云
    function drawCloud(cx, cy, scale, tint = '#c4daf7') {
      const puffs = [
        [0, 0, 74],
        [-64, 14, 54],
        [68, 16, 56],
        [-118, 28, 38],
        [124, 28, 40],
        [-28, -28, 52],
        [34, -22, 48],
      ];
      ctx.fillStyle = tint;
      for (const [dx, dy, r] of puffs) {
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy + (dy + 12) * scale, r * scale, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#ffffff';
      for (const [dx, dy, r] of puffs) {
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy + dy * scale, r * scale * 0.94, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    drawCloud(w * 0.24, h * 0.34, 1.05);
    drawCloud(w * 0.56, h * 0.26, 0.82);
    drawCloud(w * 0.82, h * 0.48, 0.9);

    // 远山与晴空屋顶剪影
    ctx.fillStyle = '#8db4e8';
    ctx.beginPath();
    ctx.moveTo(0, h);
    ctx.lineTo(0, h * 0.76);
    ctx.quadraticCurveTo(w * 0.18, h * 0.62, w * 0.38, h * 0.77);
    ctx.quadraticCurveTo(w * 0.58, h * 0.65, w * 0.8, h * 0.75);
    ctx.lineTo(w, h * 0.68);
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#6c8ec4';
    ctx.beginPath();
    ctx.moveTo(0, h);
    ctx.lineTo(0, h * 0.85);
    ctx.lineTo(w * 0.14, h * 0.82);
    ctx.lineTo(w * 0.28, h * 0.88);
    ctx.lineTo(w * 0.52, h * 0.81);
    ctx.lineTo(w * 0.74, h * 0.86);
    ctx.lineTo(w, h * 0.8);
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();

    // 暖色远景小镇轮廓
    ctx.fillStyle = '#737ba6';
    for (let i = 0; i < 16; i++) {
      const rx = i * (w / 15) - 10;
      const rh = 34 + ((i * 29) % 38);
      ctx.fillRect(rx, h - rh, w / 16 - 4, rh);
    }

    // 玻璃斜向高光
    ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
    ctx.beginPath();
    ctx.moveTo(w * 0.08, 0);
    ctx.lineTo(w * 0.22, 0);
    ctx.lineTo(w * 0.04, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();
  });
}

function makeClockFaceTexture() {

    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(cx, cy, 116, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const major = i % 3 === 0;
      ctx.strokeStyle = major ? '#ff7d54' : '#58546a';
      ctx.lineWidth = major ? 6 : 3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * (major ? 84 : 94), cy + Math.sin(ang) * (major ? 84 : 94));
      ctx.lineTo(cx + Math.cos(ang) * 106, cy + Math.sin(ang) * 106);
      ctx.stroke();
    }
  });
}

function makeKeyboardTexture(accentHex) {
  return makeCanvasTex(256, 96, (ctx, w, h) => {
    ctx.fillStyle = '#f2eef7';
    ctx.fillRect(0, 0, w, h);
    const cols = 13;
    const rows = 4;
    const kw = (w - 20) / cols;
    const kh = (h - 16) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let color = '#ffffff';
        if (r === 0 && c === 0) color = accentHex;
        else if (r === 2 && c === cols - 1) color = accentHex;
        else if (r === 3 && c >= 3 && c <= 8) {
          if (c > 3) continue;
          ctx.fillStyle = '#7cd7cf';
          ctx.fillRect(10 + c * kw + 1, 8 + r * kh + 1, kw * 6 - 3, kh - 3);
          continue;
        } else if (c === 0 || c === cols - 1) {
          color = '#d9dee8';
        }
        ctx.fillStyle = color;
        ctx.fillRect(10 + c * kw + 1, 8 + r * kh + 1, kw - 3, kh - 3);
      }
    }
  });
}

function makeAvatarVisorTexture(agent, status) {
  const accent = ACCENT_HEX[agent.name] ?? '#6ce8ff';
  return makeCanvasTex(256, 128, (ctx, w, h) => {
    ctx.fillStyle = '#1b1d30';
    ctx.fillRect(0, 0, w, h);

    // 柔和动漫腮红
    ctx.fillStyle = 'rgba(255, 122, 140, 0.55)';
    for (const bx of [54, 202]) {
      ctx.beginPath();
      ctx.ellipse(bx, 86, 18, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (status === '待核对') {
      //  peaceful 弯月睡眼 (︶ ︶)
      ctx.strokeStyle = '#c8c6e8';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      for (const ex of [82, 174]) {
        ctx.beginPath();
        ctx.arc(ex, 62, 18, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }
      return;
    }

    const eyeColor = status === '思考中' ? '#ffd166' : accent === '#5b527a' ? '#8ce8ff' : accent;
    for (const ex of [84, 172]) {
      ctx.fillStyle = eyeColor;
      ctx.beginPath();
      ctx.ellipse(ex, 58, 18, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex - 6, 48, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + 6, 66, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    if (status === '思考中') {
      ctx.fillStyle = '#ffe58f';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(114 + i * 14, 96, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.strokeStyle = '#ffd5c2';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(128, 76, 11, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  });
}

function getContactShadowTexture() {
  if (contactShadowTex) return contactShadowTex;
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.08, size / 2, size / 2, size * 0.5);
  grad.addColorStop(0, 'rgba(42, 46, 72, 0.42)');
  grad.addColorStop(0.55, 'rgba(42, 46, 72, 0.14)');
  grad.addColorStop(1, 'rgba(42, 46, 72, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  contactShadowTex = new THREE.CanvasTexture(canvas);
  contactShadowTex.colorSpace = THREE.SRGBColorSpace;
  return contactShadowTex;
}

function getDustSpriteTexture() {
  if (steamSpriteTex) return steamSpriteTex;
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255, 252, 240, 1)');
  grad.addColorStop(0.5, 'rgba(255, 244, 214, 0.45)');
  grad.addColorStop(1, 'rgba(255, 244, 214, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  steamSpriteTex = new THREE.CanvasTexture(canvas);
  steamSpriteTex.colorSpace = THREE.SRGBColorSpace;
  return steamSpriteTex;
}

function makeContactShadow(w, d, opacity = 0.22) {
  const mat = new THREE.MeshBasicMaterial({
    map: getContactShadowTexture(),
    transparent: true,
    opacity,
    depthWrite: false,
    polygonOffset: true,
    polygonOffsetFactor: -1,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

function buildAnimePlant(x, z, potColor = 0xe3845e, scale = 1.0) {
  const plant = new THREE.Group();
  plant.position.set(x, 0, z);
  plant.scale.setScalar(scale);

  const potProfile = [
    [0.01, 0.0],
    [0.17, 0.0],
    [0.24, 0.19],
    [0.225, 0.38],
    [0.19, 0.38],
    [0.19, 0.33],
  ].map(([r, y]) => new THREE.Vector2(r, y));
  const pot = new THREE.Mesh(new THREE.LatheGeometry(potProfile, 24), std(potColor, 0.62));
  pot.castShadow = true;
  plant.add(pot);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.215, 0.022, 8, 24), std(0xfff5e6, 0.65));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.365;
  plant.add(rim);

  const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.04, 16), std(0x4a382b, 0.92));
  soil.position.y = 0.32;
  plant.add(soil);

  const stemMat = std(0x3a7a4f, 0.78);
  const leafDark = std(0x2fa866, 0.62);
  const leafBright = std(0x63d471, 0.56);

  const count = 10;
  for (let i = 0; i < count; i++) {
    const yaw = (i / count) * Math.PI * 2 + (i % 2) * 0.22;
    const h = 0.42 + (i % 3) * 0.15;
    const tilt = 0.38 + (i % 3) * 0.14;
    const branch = new THREE.Group();
    branch.position.y = 0.33;
    branch.rotation.y = yaw;

    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.018, h, 6), stemMat);
    stalk.position.set(0, h * 0.45, Math.sin(tilt) * h * 0.16);
    stalk.rotation.x = tilt * 0.65;
    branch.add(stalk);

    const blade = new THREE.Mesh(new THREE.SphereGeometry(0.145, 12, 10), i % 2 === 0 ? leafDark : leafBright);
    blade.scale.set(0.82, 0.18, 1.45);
    blade.position.set(0, h * 0.88, Math.sin(tilt) * h * 0.46 + 0.08);
    blade.rotation.x = tilt;
    blade.castShadow = true;
    branch.add(blade);
    plant.add(branch);
  }

  const sprout = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), leafBright);
  sprout.position.set(0, 0.74, 0);
  sprout.scale.set(1.0, 1.25, 1.0);
  plant.add(sprout);

  const shadow = makeContactShadow(0.86, 0.86, 0.22);
  shadow.position.set(0, 0.012, 0);
  plant.add(shadow);
  return plant;
}

function updateCutawayWalls() {
  if (!backWallGroup || !leftWallGroup) return;
  const hideBack = camera.position.z < -ROOM.d / 2 + 2.0;
  const hideLeft = camera.position.x < -ROOM.w / 2 + 2.0;
  const targetBack = hideBack ? 0.045 : 1.0;
  const targetLeft = hideLeft ? 0.045 : 1.0;
  const factor = REDUCED_MOTION ? 1.0 : 0.14;

  backWallGroup.scale.y = THREE.MathUtils.lerp(backWallGroup.scale.y, targetBack, factor);
  leftWallGroup.scale.y = THREE.MathUtils.lerp(leftWallGroup.scale.y, targetLeft, factor);

  const showBackDecor = backWallGroup.scale.y > 0.35;
  if (windowGroup) windowGroup.visible = showBackDecor;
  if (backWallDecor) backWallDecor.visible = showBackDecor;
  if (sunbeamGroup) sunbeamGroup.visible = showBackDecor;
  if (leftWallDecor) leftWallDecor.visible = leftWallGroup.scale.y > 0.35;
}

    hand.position.set(0, -0.09, 0.22);
    armPivot.add(hand);

  const leftArm = makeArm(1);
  const rightArm = makeArm(-1);

  // 思考中工位头侧浮动发光小灵感球

  return { group: g, head: headGroup, body, leftArm, rightArm, ideaOrb };

function addSteamPuff(x, y, z, phase) {
  const mat = new THREE.SpriteMaterial({
    map: getDustSpriteTexture(),
    color: 0xffffff,
    transparent: true,
    opacity: 0.35,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(mat);
  sprite.position.set(x, y, z);
  sprite.scale.set(0.06, 0.06, 0.06);
  steamPuffs.push({ sprite, originX: x, originY: y, originZ: z, phase, speed: 0.55 + (phase % 0.3) });
  return sprite;
}

    const lampArm = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.34, 8), alumMat);

    g.add(lampArm);
    const lampHead = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.062, 0.12, 14), std(accentColor, 0.45));

  g.add(mug);
  const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.037, 12), std(0x6b4426, 0.35));

  coffee.position.set(0.5, 0.858, -0.05);

  const nb1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.022, 0.26), std(0x88d4f7, 0.72));

  plateGroup.add(plateBacking);

  const plate = new THREE.Mesh(

  // 精密状态 LED 指示钮
  const statusColor = STATUS_COLORS[snap.status];

  // 灵动形象 + 工学座椅（Zone C 使用带靠垫共享长凳，Zone A/B 使用带靠背彩色转椅）
  const rig = buildAvatar(agent, snap.status);
  rig.group.position.set(0, 0, -0.78);
  g.add(rig.group);
  avatarRigs.push({
    ...rig,
    baseY: 0,
    phase: agent.id * 1.15,
    status: snap.status,
  });

  if (zone !== 'C') {
    const chairCol = new THREE.Color(accentColor).lerp(new THREE.Color(0xffffff), 0.35);
    const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.06, 0.46), std(chairCol, 0.78));
    chairSeat.position.set(0, 0.42, -0.78);
    chairSeat.castShadow = true;
    g.add(chairSeat);
    const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.34, 0.055), std(chairCol, 0.78));
    chairBack.position.set(0, 0.62, -1.0);
    chairBack.rotation.x = -0.1;
    chairBack.castShadow = true;
    g.add(chairBack);
    const chairStem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.38, 10), frameMat);
    chairStem.position.set(0, 0.21, -0.78);
    g.add(chairStem);
    const chairBase = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.025, 16), frameMat);
    chairBase.position.set(0, 0.015, -0.78);
    g.add(chairBase);
    const chairShadow = makeContactShadow(0.78, 0.78, 0.2);
    chairShadow.position.set(0, 0.012, -0.78);
    g.add(chairShadow);
  }

  // 头顶标签与引线挂在工位组内（本地坐标），确保带旋转角工位（如 GPT 网页版 / Codex）也能对齐头顶。
  const stagger = ZONE_A_STAGGER[agent.name] || ZONE_B_STAGGER[agent.name];
  const label = makeHeadLabel(agent, defaultModel, STATUS_HEX[snap.status]);
  const avatarTopY = 1.48;
  const localAnchor = new THREE.Vector3(
    stagger ? stagger.dx : 0,
    avatarTopY + (stagger ? stagger.dy : 0.5),
    -0.78,
  );
  label.position.copy(localAnchor);
  g.add(label);
  headLabels[agent.id] = label;
  if (stagger) {
    if (ZONE_A_STAGGER[agent.name]) zoneALabels[agent.name] = label;
    if (ZONE_B_STAGGER[agent.name]) zoneBLabels[agent.name] = label;
    const localTop = new THREE.Vector3(0, avatarTopY, -0.78);
    g.add(makeLeaderLine(localTop, localAnchor));
  }

  // 点击拾取：桌面 + 显示器 + 桌牌 + 角色躯干/头部
  for (const m of [top, monitor, screenPlane, plate, rig.body, rig.head.children[0]]) {
    m.userData.agentId = agent.id;
    pickables.push(m);
  }
  scene.add(g);
  return g;
}

function loadSavedThreadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_THREADS_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch {
    return {};
  }
}

function saveThreadStore() {
  const persistable = {};
  for (const agent of state.config.agents) {
    const entry = state.conversations[agent.id];
    if (!entry) continue;
    // 只持久化本地模拟记录，真实桥接会话由 ~/.codex 和 Antigravity DB 维护。
    const localOnly = entry.recent.filter((c) => c.source !== 'bridge').slice(0, 3);
    if (localOnly.length > 0) {
      persistable[agent.id] = localOnly;
    }
  }
  try {
    localStorage.setItem(STORAGE_THREADS_KEY, JSON.stringify(persistable));
  } catch {
    // 忽略私密模式写入限制
  }
}

function initConversations() {
  const saved = loadSavedThreadStore();
  for (const agent of state.config.agents) {
    const custom = Array.isArray(saved[agent.id]) ? saved[agent.id] : [];
    const seeds = DEFAULT_RECENT_THREADS[agent.id] || [];
    const merged = [...custom];
    for (const s of seeds) {
      if (merged.length >= 3) break;
      if (!merged.some((item) => item.id === s.id)) {
        merged.push(JSON.parse(JSON.stringify(s)));
      }
    }
    state.conversations[agent.id] = {
      recent: merged.slice(0, 3),
      activeId: merged[0]?.id ?? null,
    };
  }
}

function getAgentRecent(agentId) {
  return state.conversations[agentId]?.recent || [];
}

function getActiveConversation(agentId) {
  const entry = state.conversations[agentId];
  if (!entry || !entry.activeId) return null;
  return entry.recent.find((c) => c.id === entry.activeId) || null;
}

function formatNowShort() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function makeShortTitle(text, fallback = '新对话') {
  const cleaned = String(text || '').replace(/\s+/g, ' ').trim();
  if (!cleaned) return fallback;
  return cleaned.length > 26 ? `${cleaned.slice(0, 25)}…` : cleaned;
}

function upsertRecentThread(agentId, thread) {
  const entry = state.conversations[agentId] || { recent: [], activeId: null };
  const filtered = entry.recent.filter((c) => c.id !== thread.id);
  filtered.unshift(thread);
  entry.recent = filtered.slice(0, 3);
  entry.activeId = thread.id;
  state.conversations[agentId] = entry;
  if (thread.source !== 'bridge') {
    saveThreadStore();
  }
}

function modePillClass(mode) {
  if (mode === 'local') return 'local';
  if (mode === 'cloud') return 'cloud';
  return 'record';
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  let ts = new Date(`${dateStr}T00:00:00`).getTime();
  if (Number.isNaN(ts)) ts = new Date(dateStr).getTime();
  if (Number.isNaN(ts)) return null;
  return Math.max(0, Math.floor((Date.now() - ts) / 86400000));
}

function updateAgentModelVisuals(agentId, model) {
  const agent = state.config.agents.find((a) => a.id === agentId);
  if (!agent) return;
  const displayModel = model ?? agent.defaultModel;
  const plate = deskPlates[agentId];
  if (plate) {
    plate.texture.dispose();
    const tex = makeDeskPlateTexture(agent, displayModel, ACCENT_HEX[agent.name]);
    tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
    plate.mesh.material.map = tex;
    plate.mesh.material.needsUpdate = true;
    plate.texture = tex;
  }
  const label = headLabels[agentId];
  if (label) {
    const modelEl = label.element.querySelector('.model');
    if (modelEl) modelEl.textContent = displayModel || '待核对';
  }
}

function updateDock() {
  const agent = state.currentAgent
    ? state.config.agents.find((a) => a.id === state.currentAgent)
    : null;
  document.getElementById('chip-agent').textContent = agent ? agent.name : '—';
  document.getElementById('chip-model').textContent = agent
    ? (state.selectedModels[agent.id] ?? agent.defaultModel ?? '待核对')
    : '—';
  document.getElementById('chip-thinking').textContent = agent ? (agent.thinkingLevel ?? '—') : '—';
  document.getElementById('chip-topic').textContent = state.currentTopic || '—';
}

function renderDrawer() {
  const agents = state.config.agents;

  // 1. 工位列表
  const agentsPanel = document.getElementById('panel-agents');
  agentsPanel.replaceChildren();
  for (const agent of agents) {
    const snap = SNAPSHOT[agent.id];
    const zone = LAYOUT[agent.id]?.zone ?? '—';
    const currentModel = state.selectedModels[agent.id] ?? agent.defaultModel ?? '待核对';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'agent-row';
    if (state.currentAgent === agent.id) btn.classList.add('active');

    const topLine = document.createElement('div');
    topLine.className = 'agent-row-top';

    const left = document.createElement('span');
    left.className = 'agent-row-id';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = STATUS_HEX[snap.status];
    const nameEl = document.createElement('span');
    nameEl.className = 'agent-name';
    nameEl.textContent = agent.name;
    const zoneBadge = document.createElement('span');
    zoneBadge.className = 'zone-tag';
    zoneBadge.textContent = zone;
    left.append(dot, nameEl, zoneBadge);

    if (agent.bridge === 'antigravity-cli' && state.antigravityBridge.connected) {
      const agBadge = document.createElement('span');
      agBadge.className = 'zone-tag agy-tag';
      agBadge.textContent = '双模';
      agBadge.title = '支持本地工作区与云端对话';
      left.appendChild(agBadge);
    } else if (agent.bridge === 'codex-cli' && state.codexBridge.connected) {
      const cliBadge = document.createElement('span');
      cliBadge.className = 'zone-tag cli-tag';
      cliBadge.textContent = 'CLI';
      left.appendChild(cliBadge);
    }

    const modelTag = document.createElement('span');
    modelTag.className = 'agent-model-tag';
    modelTag.textContent = currentModel;

    topLine.append(left, modelTag);

    const taskLine = document.createElement('div');
    taskLine.className = 'agent-row-task';
    taskLine.textContent = `${snap.status} · ${snap.task}`;

    btn.append(topLine, taskLine);

    if (snap.progress > 0) {
      const track = document.createElement('div');
      track.className = 'progress-track';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      fill.style.width = `${snap.progress}%`;
      fill.style.background = ACCENT_HEX[agent.name] ?? '#1f9d63';
      track.appendChild(fill);
      btn.appendChild(track);
    }

    btn.addEventListener('click', () => focusAgent(agent.id));
    agentsPanel.appendChild(btn);
  }

  if (boss) {
    const bossBtn = document.createElement('button');
    bossBtn.type = 'button';
    bossBtn.className = 'agent-row boss-row';
    if (state.inspectingBoss) bossBtn.classList.add('active');

    const topLine = document.createElement('div');
    topLine.className = 'agent-row-top';
    const left = document.createElement('span');
    left.className = 'agent-row-id';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = '#e88422';
    const nameEl = document.createElement('span');
    nameEl.className = 'agent-name';
    nameEl.textContent = '老板 · 宇航员奶龙';
    const zoneBadge = document.createElement('span');
    zoneBadge.className = 'zone-tag boss-tag';
    zoneBadge.textContent = 'BOSS';
    left.append(dot, nameEl, zoneBadge);

    const modeTag = document.createElement('span');
    modeTag.className = 'agent-model-tag';
    modeTag.id = 'boss-drawer-mode';
    modeTag.textContent = boss.isPaused() ? '已暂停' : boss.isSitting() ? '休息中' : '巡查中';
    topLine.append(left, modeTag);

    const taskLine = document.createElement('div');
    taskLine.className = 'agent-row-task';
    taskLine.id = 'boss-drawer-status';
    taskLine.textContent = boss.getStatus();

    bossBtn.append(topLine, taskLine);
    bossBtn.addEventListener('click', focusBoss);
    agentsPanel.appendChild(bossBtn);
  }

  // 2. 模型选择器
  const modelsPanel = document.getElementById('panel-models');
  modelsPanel.replaceChildren();
  for (const agent of agents) {
    const group = document.createElement('div');
    group.className = 'model-group';

    const head = document.createElement('div');
    head.className = 'model-group-head';
    const title = document.createElement('span');
    title.className = 'model-group-name';
    title.textContent = agent.name;
    const plan = document.createElement('span');
    plan.className = 'model-group-plan';
    plan.textContent = agent.plan ?? '未接入';
    head.append(title, plan);
    group.appendChild(head);

    const list = document.createElement('div');
    list.className = 'model-chip-list';
    if (agent.models.length === 0) {
      const note = document.createElement('div');
      note.className = 'model-empty-note';
      note.textContent = '模型列表待核对，仅支持自定义输入。';
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'model-chip pending';
      chip.textContent = '自定义模型';
      chip.addEventListener('click', () => startNewConversation(agent.id));
      list.append(note, chip);
    } else {
      for (const model of agent.models) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'model-chip';
        chip.textContent = model;
        if ((state.selectedModels[agent.id] ?? agent.defaultModel) === model) chip.classList.add('active');
        chip.addEventListener('click', () => selectModel(agent.id, model));
        list.appendChild(chip);
      }
    }
    group.appendChild(list);
    modelsPanel.appendChild(group);
  }

  // 3. 14天核对检查清单
  const checkPanel = document.getElementById('panel-check');
  checkPanel.replaceChildren();
  for (const agent of agents) {
    const row = document.createElement('div');
    row.className = 'check-row';

    const head = document.createElement('div');
    head.className = 'check-row-head';
    const nameEl = document.createElement('span');
    nameEl.className = 'check-name';
    nameEl.textContent = `${agent.name} · ${agent.provider}`;

    const statusSpan = document.createElement('span');
    const days = daysSince(agent.lastVerifiedAt);
    if (agent.status !== 'verified') {
      statusSpan.className = 'check-pill warn';
      statusSpan.textContent = '未验证 · 模型列表待核对';
    } else if (days !== null && days > 14) {
      statusSpan.className = 'check-pill warn';
      statusSpan.textContent = `已超过 ${days} 天未核对`;
    } else if (days === 0) {
      statusSpan.className = 'check-pill ok';
      statusSpan.textContent = '已验证 · 今日核对';
    } else {
      statusSpan.className = 'check-pill ok';
      statusSpan.textContent = `已验证 · ${days} 天前核对`;
    }
    head.append(nameEl, statusSpan);

    const detail = document.createElement('div');
    detail.className = 'check-meta';
    detail.textContent = `默认模型：${agent.defaultModel ?? '—'} · 思考等级：${agent.thinkingLevel ?? '—'}`;
    row.append(head, detail);
    checkPanel.appendChild(row);
  }
}

function selectModel(agentId, model) {
  state.selectedModels[agentId] = model;
  updateAgentModelVisuals(agentId, model);
  state.currentAgent = agentId;
  updateDock();
  renderDrawer();
  openInspector(agentId);
}

function focusAgent(agentId) {
  const { x, z } = LAYOUT[agentId];
  controls.autoRotate = false;
  state.followBoss = false;
  state.inspectingBoss = false;
  const autoBtn = document.querySelector('.view-btn[data-view="auto"]');
  if (autoBtn) {
    autoBtn.classList.remove('active');
    autoBtn.setAttribute('aria-pressed', 'false');
  }
  state.currentAgent = agentId;
  state.cameraGoal = {
    pos: new THREE.Vector3(x + 2.2, 2.4, z + 3.4),
    target: new THREE.Vector3(x, 1.0, z),
  };
  updateDock();
  renderDrawer();
  openInspector(agentId);
}

function focusBoss() {
  if (!boss) return;
  controls.autoRotate = false;
  const autoBtn = document.querySelector('.view-btn[data-view="auto"]');
  if (autoBtn) {
    autoBtn.classList.remove('active');
    autoBtn.setAttribute('aria-pressed', 'false');
  }
  state.currentAgent = null;
  state.inspectingBoss = true;
  const bp = boss.root.position;
  const yaw = boss.root.rotation.y;
  const fwdX = Math.sin(yaw);
  const fwdZ = Math.cos(yaw);
  state.cameraGoal = {
    pos: new THREE.Vector3(bp.x + fwdX * 4.0 + fwdZ * 1.45, 2.35, bp.z + fwdZ * 4.0 - fwdX * 1.45),
    target: new THREE.Vector3(bp.x, 1.15, bp.z),
  };
  updateDock();
  renderDrawer();
  openBossInspector();
}

function getAgentConnectionLabel(agent) {

      ? `本机 Codex CLI（${state.codexBridge.cliVersion || '已连'}）`

  const statusBlock = document.createElement('div');
  statusBlock.className = 'inspector-status';
  const statusLine = document.createElement('div');
  statusLine.className = 'inspector-status-text';
  statusLine.textContent = `${snap.status} · ${snap.task}${snap.progress ? `（${snap.progress}%）` : ''}`;
  statusBlock.appendChild(statusLine);
  if (snap.progress > 0) {
    const track = document.createElement('div');
    track.className = 'progress-track';
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    fill.style.width = `${snap.progress}%`;

    track.appendChild(fill);

  }

  const grid = document.createElement('div');
  grid.className = 'spec-grid';
  const specs = [
    ['订阅套餐', agent.plan ?? '未接入'],
    ['思考等级', agent.thinkingLevel ?? '—'],
    ['当前模型', model ?? '待核对（仅自定义）'],
    [
      agent.bridge ? '连接方式' : agent.surface === 'Web' ? '核对 · 入口' : '核对日期',
      getAgentConnectionLabel(agent),
    ],
  ];
  for (const [k, v] of specs) {
    const cell = document.createElement('div');
    cell.className = 'spec-cell';
    const label = document.createElement('div');
    label.className = 'spec-k';
    label.textContent = k;
    const val = document.createElement('div');
    val.className = 'spec-v';
    val.textContent = v;
    cell.append(label, val);
    grid.appendChild(cell);
  }
  body.appendChild(grid);

  // 最近 3 条对话选择区（所有 6 个系列统一支持）
  const recent = getAgentRecent(agentId);
  const activeId = state.conversations[agentId]?.activeId;
  const recentSection = document.createElement('div');
  recentSection.className = 'recent-section';
  const recentHead = document.createElement('div');
  recentHead.className = 'recent-head';
  const rTitle = document.createElement('span');
  rTitle.textContent = `最近对话（${recent.length}）`;
  const rHint = document.createElement('span');
  rHint.textContent = '点击续聊 / 新开';
  recentHead.append(rTitle, rHint);
  recentSection.appendChild(recentHead);

  const recentList = document.createElement('div');
  recentList.className = 'recent-list';
  for (const conv of recent) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'recent-item';
    if (conv.id === activeId) item.classList.add('active');

    const titleDiv = document.createElement('div');
    titleDiv.className = 'recent-item-title';
    titleDiv.textContent = conv.title;

    const metaDiv = document.createElement('div');
    metaDiv.className = 'recent-item-meta';
    const pill = document.createElement('span');
    pill.className = `mode-pill ${modePillClass(conv.mode)}`;
    pill.textContent = conv.active ? `${conv.modeLabel} · 运行中` : (conv.modeLabel || '记录');
    const timeEl = document.createElement('span');
    timeEl.textContent = conv.time || '最近';
    metaDiv.append(pill, timeEl);

    item.append(titleDiv, metaDiv);
    item.addEventListener('click', () => selectRecentConversation(agentId, conv.id));
    recentList.appendChild(item);
  }
  recentSection.appendChild(recentList);
  body.appendChild(recentSection);

  const actions = document.createElement('div');
  actions.className = 'inspector-actions';
  const chatBtn = document.createElement('button');
  chatBtn.type = 'button';
  chatBtn.id = 'inspector-chat';
  chatBtn.textContent = '+ 新开对话';
  chatBtn.addEventListener('click', () => startNewConversation(agentId));

  const continueBtn = document.createElement('button');
  continueBtn.type = 'button';
  continueBtn.className = 'secondary';
  continueBtn.id = 'inspector-custom';
  continueBtn.textContent = recent.length > 0 ? '继续最近' : '自定义输入';
  continueBtn.addEventListener('click', () => {
    if (recent.length > 0) {
      selectRecentConversation(agentId, recent[0].id);
    } else {
      startNewConversation(agentId);

  });

  actions.append(chatBtn, continueBtn);
  body.appendChild(actions);
  document.getElementById('inspector').hidden = false;
}
